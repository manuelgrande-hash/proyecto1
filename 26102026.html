<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="C:\Users\manue\Desktop\Asignaturas\Lenguaje de marca\26102026.css">
    <title>Formulario de Contacto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        form {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        div {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input {
            padding: 8px;
            font-size: 14px;
        }
        button {
            padding: 10px;
            background-color: #0e0d0d;
            border: 1px solid #ccc;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <form>
        <h2>Formulario de Contacto</h2>

        <div>
            <label for="nombre">Nombre</label>
            <input 
                type="text" 
                id="nombre" 
                name="nombre" 
                placeholder="Introduce tu nombre" 
                maxlength="40" 
                pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" 
                title="Solo se permiten letras y espacios (máximo 40 caracteres)."
                required 
                autofocus>
        </div>

        <div>
            <label for="cp">Código postal</label>
            <input 
                type="text" 
                id="cp" 
                name="cp" 
                placeholder="Introduce tu código postal" 
                maxlength="5" 
                pattern="\d{5}" 
                title="Debe contener exactamente 5 dígitos numéricos."
                required>
        </div>

        <div>
            <label for="edad">Edad</label>
            <input 
                type="text" 
                id="edad" 
                name="edad" 
                placeholder="Introduce tu edad" 
                maxlength="2" 
                pattern="\d{9}" 
                title="Debe ser un número de exactamente 2 dígitos."
                required>
        </div>

        <button type="submit">ENVIAR</button>
    </form>

</body>
</html>
